name: Build fudigOS ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build curl gnupg debian-archive-keyring

      - name: Configure fudigOS with Chrome and Bottles
        run: |
          mkdir -p ~/fudigos && cd ~/fudigos
          lb config \
            --distribution bookworm \
            --architectures amd64 \
            --iso-application "fudigOS" \
            --iso-volume "fudigOS_Live" \
            --iso-publisher "fudigOS Project" \
            --keyring-packages debian-archive-keyring \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components hostname=fudigos username=user quiet splash"

          # Pacotes do sistema, interface XFCE, Wine64, Flatpak e Instalador
          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/fudigos.list.chroot
          task-xfce-desktop
          lightdm
          flatpak
          wine
          wine64
          winetricks
          calamares
          calamares-settings-debian
          curl
          wget
          xdg-utils
          neofetch
          EOF

          # Repositório oficial do Google Chrome
          mkdir -p config/archives
          curl -fsSL https://google.com | gpg --dearmor > config/archives/google-chrome.key.chroot
          echo "deb [arch=amd64] http://google.com stable main" > config/archives/google-chrome.list.chroot
          echo "google-chrome-stable" >> config/package-lists/fudigos.list.chroot

          # Personalização do fudigOS e configuração do Bottles
          mkdir -p config/hooks/normal
          cat << 'EOF' > config/hooks/normal/0100-setup-fudigos.hook.chroot
          #!/bin/bash
          set -e

          # 1. Identidade visual do fudigOS
          cat << 'OSREL' > /etc/os-release
          PRETTY_NAME="fudigOS 1.0"
          NAME="fudigOS"
          VERSION_ID="1.0"
          VERSION="1.0 (Initial Release)"
          ID=fudigos
          ID_LIKE=debian
          HOME_URL="https://github.com"
          OSREL

          echo "fudigOS 1.0 \n \l" > /etc/issue
          echo "fudigOS 1.0" > /etc/issue.net

          # 2. Adiciona o repositório Flathub
          flatpak remote-add --if-not-exists flathub https://flathub.org

          # 3. Script de primeiro boot para instalar o Bottles sem erro de sandbox
          cat << 'FIRSTBOOT' > /usr/local/bin/install-bottles.sh
          #!/bin/bash
          if ! flatpak list | grep -q com.usebottles.bottles; then
            flatpak install -y --noninteractive flathub com.usebottles.bottles
            rm -f /etc/xdg/autostart/install-bottles.desktop
          fi
          FIRSTBOOT
          chmod +x /usr/local/bin/install-bottles.sh

          mkdir -p /etc/xdg/autostart
          cat << 'AUTOSTART' > /etc/xdg/autostart/install-bottles.desktop
          [Desktop Entry]
          Type=Application
          Name=Setup Bottles for Windows Apps
          Exec=/usr/local/bin/install-bottles.sh
          Terminal=false
          AUTOSTART

          # 4. Associa arquivos .exe e .msi ao Bottles
          mkdir -p /etc/xdg
          cat << 'MIME' > /etc/xdg/mimeapps.list
          [Default Applications]
          application/x-ms-dos-executable=com.usebottles.bottles.desktop;
          application/x-msi=com.usebottles.bottles.desktop;
          MIME
          EOF
          chmod +x config/hooks/normal/0100-setup-fudigos.hook.chroot

      - name: Build fudigOS ISO
        run: |
          cd ~/fudigos
          sudo lb build

      - name: Rename and Upload fudigOS ISO Artifact
        run: |
          mv ~/fudigos/*.iso ~/fudigos/fudigOS-1.0-amd64.iso
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fudigOS-1.0-amd64-ISO
          path: ~/fudigos/fudigOS-1.0-amd64.iso
